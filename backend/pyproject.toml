[project]
name = "lmcs-backend"
version = "0.1.0"
description = "Legal Metrology Compliance Scanning Platform — API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "PyJWT[crypto]>=2.9.0",
  "asyncpg>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "jinja2>=3.1.4",
  "weasyprint>=62.0",
  "python-docx>=1.1.2",
  "qrcode>=8.0",
  "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"

[tool.pyright]
venvPath = "."
venv = ".venv"

