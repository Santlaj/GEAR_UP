<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" fill="#1e293b">
  <!-- State Emblem of India representation -->
  <g id="lions">
    <!-- Center Lion -->
    <path d="M46,8 C43,10 42,14 43,18 C41,20 39,23 39,27 C39,33 42,38 45,41 C43,45 42,50 43,55 C44,60 47,65 50,67 C53,65 56,60 57,55 C58,50 57,45 55,41 C58,38 61,33 61,27 C61,23 59,20 57,18 C58,14 57,10 54,8 C52,6 48,6 46,8 Z" fill="#0f172a" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="47" cy="22" r="1.5" fill="#f8fafc"/>
    <circle cx="53" cy="22" r="1.5" fill="#f8fafc"/>
    <path d="M47,26 Q50,29 53,26" stroke="#f8fafc" stroke-width="1.2" fill="none"/>
    <path d="M50,29 L50,34" stroke="#f8fafc" stroke-width="1.2"/>
    <path d="M46,38 Q50,42 54,38" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
    
    <!-- Left Lion (profile) -->
    <path d="M38,20 C34,22 30,26 28,32 C26,38 27,45 29,51 C32,58 37,63 43,66 C39,60 38,52 38,45 C38,36 40,28 38,20 Z" fill="#1e293b"/>
    <circle cx="31" cy="31" r="1.2" fill="#f8fafc"/>
    <path d="M29,35 Q33,37 36,34" stroke="#f8fafc" stroke-width="1" fill="none"/>
    
    <!-- Right Lion (profile) -->
    <path d="M62,20 C66,22 70,26 72,32 C74,38 73,45 71,51 C68,58 63,63 57,66 C61,60 62,52 62,45 C62,36 60,28 62,20 Z" fill="#1e293b"/>
    <circle cx="69" cy="31" r="1.2" fill="#f8fafc"/>
    <path d="M71,35 Q67,37 64,34" stroke="#f8fafc" stroke-width="1" fill="none"/>
    
    <!-- Lion Mane Texture lines -->
    <path d="M43,45 Q46,50 44,57 M57,45 Q54,50 56,57 M47,48 Q50,54 48,60 M53,48 Q50,54 52,60" stroke="#f8fafc" stroke-width="0.8" fill="none"/>
  </g>
  
  <!-- Abacus Plate -->
  <rect x="20" y="70" width="60" height="12" rx="2" fill="#0f172a"/>
  
  <!-- Ashoka Chakra (Wheel of Dharma) in center of Abacus -->
  <circle cx="50" cy="76" r="5" fill="none" stroke="#f8fafc" stroke-width="0.9"/>
  <circle cx="50" cy="76" r="1" fill="#f8fafc"/>
  <!-- Spokes -->
  <line x1="50" y1="71" x2="50" y2="81" stroke="#f8fafc" stroke-width="0.6"/>
  <line x1="45" y1="76" x2="55" y2="76" stroke="#f8fafc" stroke-width="0.6"/>
  <line x1="46.5" y1="72.5" x2="53.5" y2="79.5" stroke="#f8fafc" stroke-width="0.6"/>
  <line x1="46.5" y1="79.5" x2="53.5" y2="72.5" stroke="#f8fafc" stroke-width="0.6"/>
  
  <!-- Horse (Left on abacus) -->
  <path d="M26,78 C28,75 31,73 34,75 C36,76 35,78 33,79 C30,80 27,80 26,78 Z" fill="#f8fafc"/>
  
  <!-- Bull (Right on abacus) -->
  <path d="M66,75 C69,73 72,75 74,78 C73,80 70,80 67,79 C65,78 64,76 66,75 Z" fill="#f8fafc"/>
  
  <!-- Inverted Lotus Base -->
  <path d="M24,84 C30,92 70,92 76,84 C74,94 26,94 24,84 Z" fill="#0f172a"/>
  <path d="M30,86 Q50,95 70,86" stroke="#f8fafc" stroke-width="0.7" fill="none"/>
  
  <!-- Base Pedestal -->
  <rect x="22" y="96" width="56" height="4" rx="1" fill="#0f172a"/>
  
  <!-- Satyameva Jayate text representation -->
  <text x="50" y="112" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#0f172a" letter-spacing="1">सत्यमेव जयते</text>
</svg>
